<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STL Vault</title>
<style>
:root {
  --void:#0e0a1e; --surface:#1a1435; --surface-2:#251e45; --hairline:rgba(255,255,255,.13);
  --accent:#b18cff; --accent-rgb:177,140,255; --teal:#e57bd8; --ink:#eef1f7;
  --ink-dim:rgba(238,241,247,.6); --ink-faint:rgba(238,241,247,.42); --fail:#ef5b52; --warn:#e08a3c;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
button,select{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#1c2530;border-radius:999px}

/* ---------- toolbar ---------- */
.toolbar{
  height:48px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;
  border-bottom:1px solid var(--hairline);background:rgba(11,14,18,.92);
}
.brand{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.22em;color:#fff}
.brand em{color:var(--teal);font-style:normal}
.crumbs{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11px;color:var(--ink-dim);overflow:hidden}
.crumbs button{padding:3px 8px;border-radius:6px;color:var(--ink-dim);letter-spacing:.04em;display:flex;align-items:center;gap:4px}
.crumbs button:hover{background:var(--surface-2);color:var(--ink)}
.crumbs button.drop-target{border:1px solid var(--teal);background:rgba(53,224,208,.15)}
.crumbs .sep{color:var(--ink-faint)}
.toolbar .spacer{flex:1}
.view-toggle{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--hairline);border-radius:999px;padding:2px}
.tbtn{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  padding:6px 12px;border-radius:999px;border:1px solid var(--hairline);color:var(--ink-dim);
  transition:all .15s;display:inline-flex;align-items:center;gap:4px;
}
.vbtn{
  font-family:var(--mono);font-size:10px;padding:4px 10px;border-radius:999px;border:0;color:var(--ink-dim);
  transition:all .15s;display:flex;align-items:center;gap:4px;
}
.vbtn:hover{color:var(--ink)}
.vbtn.active{background:var(--surface-2);color:var(--accent);font-weight:600}
.tbtn.mini{padding:2px 7px;font-size:9px}
.tbtn:hover{color:var(--accent);border-color:rgba(var(--accent-rgb),.5)}

.slicer-select{
  background:var(--surface);border:1px solid var(--hairline);border-radius:999px;
  padding:5px 10px;font-family:var(--mono);font-size:10px;color:var(--accent);
  outline:none;letter-spacing:.05em;
}
.slicer-select:hover{border-color:var(--accent)}
.slicer-select option{background:#131920;color:var(--ink)}

.search{
  background:#080c11;border:1px solid var(--hairline);border-radius:8px;
  padding:5px 10px;font-size:12px;color:var(--ink);outline:none;width:150px;
}
.search:focus{border-color:rgba(var(--accent-rgb),.5)}

/* ---------- layout ---------- */
.main{flex:1;display:flex;min-height:0}
.sidebar{
  width:230px;flex:none;border-right:1px solid var(--hairline);overflow-y:auto;
  background:var(--surface);padding:10px 8px;
}
.sidebar-head{display:flex;align-items:center;justify-content:space-between;margin:4px 8px 8px}
.sidebar h3{margin:0;font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--ink-faint);text-transform:uppercase}
.lib-list{margin-bottom:12px;display:flex;flex-direction:column;gap:3px}
.lib-item{
  display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;text-align:left;
  padding:5px 8px;border-radius:7px;font-size:12px;color:var(--ink-dim);
  border:1px solid transparent;
}
.lib-item:hover{background:var(--surface-2);color:var(--ink)}
.lib-item.active{color:var(--accent);background:rgba(var(--accent-rgb),.12);font-weight:600}
.lib-item.drop-target{border-color:var(--teal);background:rgba(53,224,208,.12)}

.tree-item{
  display:flex;align-items:center;gap:7px;width:100%;text-align:left;
  padding:5px 8px;border-radius:7px;font-size:12px;color:var(--ink-dim);
  border:1px solid transparent;
}
.tree-item:hover{background:var(--surface-2);color:var(--ink)}
.tree-item.current{color:var(--accent);background:rgba(var(--accent-rgb),.1)}
.tree-item.drop-target{border-color:var(--teal);background:rgba(53,224,208,.12)}
.tree-item .tw{color:var(--ink-faint);width:10px;flex:none;font-size:9px}
.tree-kids{margin-left:14px}

.content{flex:1;overflow-y:auto;padding:16px 18px;position:relative}

/* ---------- icon grid view ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:12px 8px 10px;border-radius:14px;cursor:default;user-select:none;
  background:var(--surface);border:1px solid var(--hairline);
  transition:border-color .15s, transform .15s, box-shadow .15s;
}
.card:hover{border-color:rgba(var(--accent-rgb),.4);transform:translateY(-2px)}
.card.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(var(--accent-rgb),.3);background:rgba(var(--accent-rgb),.08)}
.card.drop-target{border-color:var(--teal);background:rgba(53,224,208,.1);box-shadow:0 0 0 3px rgba(53,224,208,.2)}
.card.dragging{opacity:.35}
.card .thumb{
  width:120px;height:120px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(80px 60px at 50% 40%, rgba(var(--accent-rgb),.07), transparent 70%), #0a0e14;
  overflow:hidden;position:relative;
}
.card .thumb img{width:100%;height:100%;object-fit:contain}
.card .thumb .big-ico{font-size:40px}
.card .thumb .rendering{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:8px;letter-spacing:.14em;color:var(--ink-faint);
  animation:pulse 1.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.card .cname{
  font-family:var(--mono);font-size:10.5px;color:var(--ink);text-align:center;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.card .cmeta{font-family:var(--mono);font-size:8.5px;color:var(--ink-faint);letter-spacing:.06em}
.card .cactions{
  position:absolute;top:6px;right:6px;display:none;gap:4px;
}
.card:hover .cactions{display:flex}
.cactions button{
  width:20px;height:20px;border-radius:6px;background:rgba(8,12,17,.9);
  border:1px solid var(--hairline);color:var(--ink-dim);font-size:10px;
  display:flex;align-items:center;justify-content:center;
}
.cactions button:hover{color:var(--accent);border-color:var(--accent)}
.cactions button.slice-btn:hover{color:var(--teal);border-color:var(--teal)}
.cactions button.del:hover{color:var(--fail);border-color:var(--fail)}

/* ---------- finder list view ---------- */
.list-view{width:100%;border-collapse:collapse;user-select:none;font-size:12px}
.list-view th{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-faint);
  text-transform:uppercase;text-align:left;padding:8px 12px;border-bottom:1px solid var(--hairline);
  cursor:pointer;
}
.list-view th:hover{color:var(--accent)}
.list-view th .sort-ico{font-size:9px;margin-left:4px;color:var(--teal)}
.list-row{
  border-bottom:1px solid rgba(255,255,255,.05);transition:background .12s;cursor:default;
}
.list-row:hover{background:var(--surface-2)}
.list-row.selected{background:rgba(var(--accent-rgb),.15);color:#fff}
.list-row.drop-target{background:rgba(53,224,208,.15);outline:1px solid var(--teal)}
.list-row.dragging{opacity:.35}
.list-row td{padding:7px 12px;vertical-align:middle;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row td.name-col{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:500}
.list-row .row-ico{width:28px;height:28px;border-radius:6px;background:#0a0e14;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;position:relative}
.list-row .row-ico img{width:100%;height:100%;object-fit:contain}
.list-row .row-ico span{font-size:16px}
.list-row .row-actions{display:none;gap:4px}
.list-row:hover .row-actions{display:flex}
.row-actions button{
  height:22px;padding:0 6px;border-radius:6px;background:rgba(8,12,17,.9);
  border:1px solid var(--hairline);color:var(--ink-dim);font-size:10px;
  display:flex;align-items:center;justify-content:center;gap:3px;
  font-family:var(--mono);
}
.row-actions button:hover{color:var(--accent);border-color:var(--accent)}
.row-actions button.slice-btn:hover{color:var(--teal);border-color:var(--teal)}
.row-actions button.del:hover{color:var(--fail);border-color:var(--fail)}

.empty{
  padding:60px 20px;text-align:center;color:var(--ink-faint);
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;line-height:2;
}

/* ---------- context menu ---------- */
.ctx-menu{
  position:fixed;z-index:300;display:none;flex-direction:column;
  min-width:190px;background:rgba(19,25,32,.97);border:1px solid var(--hairline);
  border-radius:10px;padding:4px;box-shadow:0 16px 40px rgba(0,0,0,.8);
  font-family:var(--mono);font-size:11px;
}
.ctx-menu.show{display:flex}
.ctx-item{
  position:relative;display:flex;align-items:center;justify-content:space-between;
  padding:7px 10px;border-radius:6px;color:var(--ink-dim);cursor:pointer;
  user-select:none;
}
.ctx-item:hover{background:var(--surface-2);color:var(--ink)}
.ctx-item.del:hover{color:var(--fail)}
.ctx-sub{
  position:absolute;left:100%;top:-4px;display:none;flex-direction:column;
  min-width:160px;background:rgba(19,25,32,.97);border:1px solid var(--hairline);
  border-radius:10px;padding:4px;box-shadow:0 16px 40px rgba(0,0,0,.8);
}
.ctx-item:hover > .ctx-sub{display:flex}

/* ---------- hover pop-out preview ---------- */
.popview{
  position:fixed;z-index:80;width:440px;pointer-events:none;
  background:rgba(13,18,24,.97);border:1px solid rgba(var(--accent-rgb),.4);border-radius:16px;
  box-shadow:0 24px 70px rgba(0,0,0,.8);overflow:hidden;
  opacity:0;transform:scale(.92) translateY(8px);
  transition:opacity .18s ease, transform .22s cubic-bezier(.34,1.4,.44,1);
}
.popview.show{opacity:1;transform:scale(1) translateY(0)}
.popview canvas{display:block;width:440px;height:340px}
.popview .pmeta{
  display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--hairline);
  font-family:var(--mono);font-size:10px;color:var(--ink-dim);letter-spacing:.05em;
}
.popview .pmeta b{color:var(--ink);font-size:11px}

/* ---------- pinned modal viewer ---------- */
.modal{
  position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  background:rgba(3,5,8,.82);
}
.modal.open{display:flex}
.modal-box{
  width:min(860px,94vw);height:min(620px,90vh);display:flex;flex-direction:column;
  background:var(--surface);border:1px solid rgba(var(--accent-rgb),.4);border-radius:16px;
  overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.85);
}
.modal-head{
  display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--hairline);
  font-family:var(--mono);font-size:12px;
}
.modal-head b{color:var(--accent)}
.modal-head .x{margin-left:auto;width:26px;height:26px;border-radius:8px;border:1px solid var(--hairline);color:var(--ink-dim)}
.modal-head .x:hover{color:var(--ink);border-color:var(--accent)}
.modal-body{flex:1;position:relative}
.modal-body canvas{display:block;width:100%;height:100%}
.modal-hint{
  position:absolute;bottom:10px;left:12px;font-family:var(--mono);font-size:9px;
  letter-spacing:.14em;color:var(--ink-faint);text-transform:uppercase;pointer-events:none;
}

/* ---------- os drop overlay ---------- */
.dropzone{
  position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
  background:rgba(11,14,18,.9);
}
.dropzone.show{display:flex}
.dropzone .dz-inner{
  border:2px dashed var(--teal);border-radius:20px;padding:60px 80px;text-align:center;
  font-family:var(--mono);font-size:13px;letter-spacing:.16em;color:var(--teal);text-transform:uppercase;
}
</style>
</head>
<body>

<div class="toolbar">
  <span class="brand">STL <em>VAULT</em></span>
  <div class="crumbs" id="crumbs"></div>
  <div class="spacer"></div>
  <select class="slicer-select" id="slicerSelect" title="Default Slicer Target">
    <option value="orcaslicer">🍰 OrcaSlicer</option>
    <option value="anycubic">🍰 Anycubic Next</option>
    <option value="elegoo">🍰 Elegoo Slicer</option>
    <option value="prusaslicer">🍰 PrusaSlicer</option>
    <option value="bambustudio">🍰 Bambu Studio</option>
  </select>
  <div class="view-toggle">
    <button class="vbtn active" id="viewGridBtn" title="Icon Grid View">🔲 Icons</button>
    <button class="vbtn" id="viewListBtn" title="List View">☰ List</button>
  </div>
  <input class="search" id="search" placeholder="filter…">
  <button class="tbtn" id="newFolderBtn">+ Folder</button>
  <button class="tbtn" id="uploadBtn">⇪ Upload</button>
  <input type="file" id="uploadInput" accept=".stl,.3mf" multiple hidden>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-head">
      <h3>Libraries</h3>
      <button class="tbtn mini" id="addLibBtn">+ Add</button>
    </div>
    <div class="lib-list" id="libList"></div>

    <div class="sidebar-head">
      <h3>Folders</h3>
    </div>
    <div id="tree"></div>
  </div>
  <div class="content" id="content"></div>
</div>

<div class="popview" id="popview">
  <div class="pview-canvas" id="pviewCanvas"></div>
  <div class="pmeta" id="pviewMeta"></div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <b id="modalTitle"></b>
      <button class="tbtn mini" id="modalSliceBtn" style="margin-left:12px;color:var(--teal)">🍰 Open in Slicer</button>
      <button class="x" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody">
      <div class="modal-hint">drag to orbit · scroll to zoom · right-drag to pan</div>
    </div>
  </div>
</div>

<div class="dropzone" id="dropzone"><div class="dz-inner">drop files or folders to upload</div></div>

<div class="ctx-menu" id="ctxMenu"></div>

<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
<script type="module" src="/app.js"></script>
</body>
</html>
