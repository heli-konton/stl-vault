<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STL Vault</title>
<link rel="stylesheet" href="/atrium.css">
</head>
<body>

<div class="toolbar">
  <span class="brand"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5"/><path d="M12 12v9"/></svg><span>Vault</span></span>
  <div class="crumbs" id="crumbs"></div>
  <div class="spacer"></div>
  <button class="tbtn" id="importLinkBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.8 14.2l4.4-4.4"/><path d="M11.2 7.4l1.7-1.7a3.6 3.6 0 0 1 5.1 5.1L16.3 12.5"/><path d="M12.8 16.6l-1.7 1.7a3.6 3.6 0 0 1-5.1-5.1L7.7 11.5"/></svg>Import link</button>
  <select class="slicer-select" id="slicerSelect" title="Default Slicer Target">
    <option value="orcaslicer">OrcaSlicer</option>
    <option value="anycubic">Anycubic Next</option>
    <option value="elegoo">Elegoo Slicer</option>
    <option value="prusaslicer">PrusaSlicer</option>
    <option value="bambustudio">Bambu Studio</option>
  </select>
  <div class="view-toggle">
    <button class="vbtn active" id="viewGridBtn" title="Icon Grid View"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 4.5h5.5v5.5H4.5z"/><path d="M14 4.5h5.5v5.5H14z"/><path d="M4.5 14h5.5v5.5H4.5z"/><path d="M14 14h5.5v5.5H14z"/></svg>Icons</button>
    <button class="vbtn" id="viewListBtn" title="List View"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>List</button>
  </div>
  <input class="search" id="search" placeholder="filter…">
  <button class="tbtn" id="newFolderBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.2l1.7 2.1H18.5a2 2 0 0 1 2 2v7.9a2 2 0 0 1-2 2H5.5a2 2 0 0 1-2-2z"/><path d="M12 11.5v4"/><path d="M10 13.5h4"/></svg>Folder</button>
  <button class="tbtn" id="uploadBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V5"/><path d="m8 8.6 4-4 4 4"/><path d="M4.5 19h15"/></svg>Upload</button>
  <input type="file" id="uploadInput" accept=".stl,.3mf" multiple hidden>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-head">
      <h3>Libraries</h3>
      <button class="tbtn mini" id="addLibBtn"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.5v13"/><path d="M5.5 12h13"/></svg></button>
    </div>
    <div class="lib-list" id="libList"></div>

    <div class="sidebar-head">
      <h3>Folders</h3>
    </div>
    <div id="tree"></div>
  </div>
  <div class="content" id="content"></div>
</div>

<div class="batch-bar" id="batchBar">
  <span class="batch-count" id="batchCount">0 items selected</span>
  <button class="tbtn" id="batchMoveBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h13"/><path d="m13 8 4 4-4 4"/><path d="M20 5v14"/></svg>Move to…</button>
  <button class="tbtn del" id="batchDelBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7.5h14"/><path d="M9.5 7.5V5.8h5v1.7"/><path d="M7 7.5l.7 11.2h8.6L17 7.5"/></svg>Trash</button>
  <button class="tbtn mini" id="batchClearBtn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11"/><path d="M17.5 6.5l-11 11"/></svg></button>
</div>

<div class="popview" id="popview">
  <div class="pview-canvas" id="pviewCanvas"></div>
  <div class="pmeta" id="pviewMeta"></div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <b id="modalTitle"></b>
      <button class="tbtn mini" id="modalSliceBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l8 4-8 4-8-4z"/><path d="M4 12l8 4 8-4"/><path d="M4 16l8 4 8-4"/></svg>Open in Slicer</button>
      <button class="x" id="modalClose"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11"/><path d="M17.5 6.5l-11 11"/></svg></button>
    </div>
    <div class="modal-body" id="modalBody">
      <div class="modal-hint">drag to orbit · scroll to zoom · right-drag to pan</div>
    </div>
  </div>
</div>

<div class="dropzone" id="dropzone"><div class="dz-inner">drop files or folders to upload</div></div>

<div class="ctx-menu" id="ctxMenu"></div>

<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
<script type="module" src="/app.js"></script>
</body>
</html>
